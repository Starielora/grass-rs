[package]
name = "grass-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["new_renderer"]
without_validations = []
old_renderer = []
new_renderer = []

[dependencies]
winit = "0.30.5"
ash = "0.38.0"
ash-window = "0.13.0"
nalgebra-glm = "0.19.0"
bitflags = "2.4.2"
imgui-rs-vulkan-renderer = { version = "1.16.0", features=["dynamic-rendering"] }
imgui = { version = "0.12", features = ["tables-api"] }
imgui-winit-support = "^0.13"
stb_image_rust = "2.27.2"
gltf = "1"
meshopt = "0.6"
rand = "0.10.1"

# stb_image_rust calls free(NULL), which is valid C, but since Rust 1.96 it panics with UB
# (rust-lang/rust#153251 made __rust_dealloc take NonNull<u8>)
[profile.dev.package.stb_image_rust]
debug-assertions = false
